# .github/workflows/visual.yml
#
# Task 6.3 (UI/UX Design-System Overhaul) — Playwright visual-regression
# gate. Runs on every pull request against the dashboard-web/ workspace.
#
# Baseline strategy:
#   - Snapshots live in dashboard-web/tests/visual/*.spec.ts-snapshots/
#     (Playwright's per-spec folder convention). Files are suffixed with
#     `-chromium-<os>` — e.g. `home-chromium-linux.png` for CI vs
#     `home-chromium-darwin.png` for a macOS dev. CI MUST compare against
#     a `-chromium-linux.png` baseline; if only `-darwin` baselines exist
#     the first PR run will write the linux variants. Commit those in a
#     follow-up snapshot-update PR so the gate has a permanent baseline.
#   - This workflow does NOT auto-commit baselines (avoids the silent-drift
#     trap where regressions get rubber-stamped by CI itself).
#   - Local dev: `npm run test:visual:update` regenerates the dev-machine
#     baselines (darwin/linux/win) for the spec files you change.
#
# Required env (none for snapshot rendering itself — but the dashboard's
# pages depend on Supabase + Inngest in production. CI presumes either:
#   (a) a seeded fixture DB exposed via repo secrets, OR
#   (b) the dev server boots into a documented "no-data" state that the
#       baseline captured.
# See [[ui-ux-overhaul-plan]] for the env-secret rollout plan).

name: Visual Regression

on:
  pull_request:
    paths:
      - 'dashboard-web/**'
      - '.github/workflows/visual.yml'

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install dependencies
        working-directory: ./dashboard-web
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: ./dashboard-web
        run: npx playwright install --with-deps chromium

      - name: Run visual regression suite
        working-directory: ./dashboard-web
        run: npm run test:visual
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-web/playwright-report/
          retention-days: 14

      - name: Upload test-results (traces/screenshots) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: dashboard-web/test-results/
          retention-days: 14
